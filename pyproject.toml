[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-code-search"
version = "0.1.0"
description = "Agent-facing code search service on Databricks (MCP server + indexing job over Lakebase Postgres)."
requires-python = ">=3.12"
dependencies = [
    # Upper-bounded at <2: mcp 2.0 removed `mcp.server.fastmcp` (FastMCP was renamed to
    # MCPServer under mcp.server) and renamed ToolAnnotations fields to snake_case, both of
    # which app/main.py depends on. uv.lock is gitignored, so without this ceiling `uv sync`
    # floats into 2.x and breaks the MCP app. Migrate app/main.py to the MCPServer API to lift it.
    "mcp>=1.20,<2",
    "anyio",
    "uvicorn[standard]",
    "psycopg[binary]>=3.1",
    # Upper-bounded at <2.0.52: 2.0.52 changed compiled-SQL rendering (typed casts like
    # `%(p)s::VARCHAR` and `ESCAPE '\'` instead of the untyped/`'\\'` forms), which the
    # exact-SQL-text assertions in tests/unit/test_query_compiler.py and
    # tests/unit/test_references.py pin. uv.lock is gitignored (issue #3), so without
    # this ceiling CI's fresh `uv sync` resolves 2.0.52+ and those tests fail while a
    # stale local env on 2.0.51 passes. Revisit the assertions (make them
    # version-tolerant) to lift the ceiling.
    "sqlalchemy>=2.0,<2.0.52",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "databricks-sdk>=0.81.0",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack",
    "pydantic-settings",
    "pyyaml>=6.0",
    # >=2021.11.10: floor for finditer(..., timeout=...) support, which app/search/grep.py's
    # per-request match budget depends on.
    "regex>=2021.11.10",
]

# webui/ is a SEPARATE deploy artifact from the MCP app: it imports app.* from a
# built wheel (webui/requirements.txt, `make webui-wheel`) rather than being part of the app
# package's own runtime. Keeping fastapi out of [project.dependencies] keeps app/requirements.txt
# (the MCP app's frozen manifest, regenerated by `make requirements`) byte-identical to before
# webui existed -- a plain `uv export` never sees an optional-dependencies extra unless asked
# for it. Local dev/CI still get it via `uv sync --all-extras` (see `make install` / ci.yml);
# webui/requirements.txt is exported with `--extra webui` (see that file's header comment).
[project.optional-dependencies]
webui = ["fastapi>=0.139.0"]

[project.scripts]
code-search-index = "indexer.job:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
    "asgi-lifespan",
    "types-PyYAML",
    "types-regex",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "indexer*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "unit: Pure unit tests with no external dependencies",
    "integration: Tests that exercise multiple modules together (still mocked at boundaries)",
    "e2e: In-process streamable-HTTP tests driving the real ASGI app (CI Postgres via PGHOST)",
    "observability: Logging choke-point / fault-not-swallowed / saturation-signal tests",
]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["app", "indexer", "webui"]
# Digit-named migration scripts (e.g. app/alembic/versions/0001_*.py and the gated
# app/alembic/versions_semantic/0002sem_*.py) are not importable module paths and are
# exercised by tests, not type-checked.
exclude = ["^app/alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "psycopg.*",
    "pgvector.*",
    "tree_sitter.*",
    "tree_sitter_language_pack.*",
    "databricks.*",
    "alembic.*",
    "mcp.*",
    "uvicorn.*",
]
ignore_missing_imports = true
